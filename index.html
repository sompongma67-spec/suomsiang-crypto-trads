<style>
:root{--bg:#0f1b2a;--panel:#162639;--panel2:#1c3049;--line:#26394f;--text:#e8eef5;--mute:#8da2b8;--up:#3ddc97;--down:#ff6b6b;--focus:#6fd3e6}
[data-theme=light]{--bg:#eef2f7;--panel:#ffffff;--panel2:#e9f1fb;--line:#d6dfe9;--text:#14202e;--mute:#5a6d82;--up:#13955b;--down:#d63c3c;--focus:#1176c9}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:'Sarabun',system-ui,sans-serif;min-height:100vh;transition:background .2s}
header{position:relative;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;padding:16px 24px;border-bottom:1px solid var(--line)}
h1{font-family:'Chakra Petch',sans-serif;font-size:24px;letter-spacing:.06em}
h1 span{color:#f7931a}
.grow{flex:1}
.site{width:42px;height:42px;border-radius:10px;object-fit:cover;margin-right:-8px}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.links a{color:var(--text);text-decoration:none;border:1px solid var(--line);background:var(--panel2);padding:5px 12px;border-radius:999px;font-size:13px}
.links a:hover{border-color:var(--focus)}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-size:13px;color:var(--mute)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mute);display:inline-block;margin-right:6px}
.dot.on{background:var(--up);animation:p 2s infinite}
.dot.err{background:var(--down)}
@keyframes p{50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){.dot.on{animation:none}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{background:none;border:0;color:var(--mute);padding:6px 12px;font:inherit;cursor:pointer}
.seg button.a{background:var(--line);color:var(--text);font-weight:600}
button:focus-visible,a:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.tbtn{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
main{display:grid;grid-template-columns:340px minmax(0,1fr);gap:20px;padding:20px 24px;max-width:1300px;margin:auto}
@media(max-width:900px){main{grid-template-columns:1fr}}
.coins{display:flex;flex-direction:column;gap:12px}
.coin{all:unset;box-sizing:border-box;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;padding:16px;display:block}
.coin.a{background:var(--panel2);border-color:var(--c)}
.coin:focus-visible{outline:2px solid var(--focus)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.id{display:flex;align-items:center;gap:10px}
.lg{width:34px;height:34px;flex:none}
.sym{font-family:'Chakra Petch';font-weight:700;font-size:18px;color:var(--c)}
.name{font-size:13px;color:var(--mute)}
.price{font-family:'Chakra Petch';font-size:26px;margin:8px 0 4px}
.up{color:var(--up)}.down{color:var(--down)}
.chg{font-weight:600}
.mc{font-size:13px;color:var(--mute);margin-top:6px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
.ctop{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;margin-bottom:10px}
.big{font-family:'Chakra Petch';font-size:32px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
#cv{width:100%;height:380px;display:block;cursor:crosshair}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:16px}
.stats div{border-top:1px solid var(--line);padding-top:8px;font-size:13px;color:var(--mute)}
.stats b{display:block;color:var(--text);font-size:16px;margin-top:2px}
#msg{padding:0 24px;max-width:1300px;margin:12px auto 0;color:var(--down);font-size:14px}
.mk{max-width:1300px;margin:0 auto 20px;padding:0 24px}
.mk h2{font-family:'Chakra Petch';font-size:22px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
th{color:var(--mute);font-weight:600;text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px}
td{text-align:right;padding:12px;border-bottom:1px solid var(--line)}
th:nth-child(-n+3),td:nth-child(-n+3){text-align:left}
.ex{display:flex;align-items:center;gap:8px;font-weight:600}
.ex img{width:22px;height:22px;border-radius:50%}
.go{display:inline-block;background:#1a7fe0;color:#fff;text-decoration:none;font-weight:600;padding:6px 16px;border-radius:7px}
.go:hover{background:#1569bd}
.na{color:var(--mute)}
.shell{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;max-width:2000px;margin:auto;padding:20px 16px;grid-template-areas:"c" "a" "p"}
.center{grid-area:c;min-width:0}.adbox{grid-area:a}.player{grid-area:p}
.center main{padding:0;margin:0 0 20px;max-width:none}.center .mk{padding:0;max-width:none;margin:0}
@media(min-width:760px) and (max-width:1599px){.shell{grid-template-columns:1fr 1fr;grid-template-areas:"c c" "a p"}}
@media(min-width:1600px){.shell{grid-template-columns:290px minmax(0,1fr) 310px;grid-template-areas:"a c p";align-items:start}.adbox,.player{position:sticky;top:12px}.player{height:calc(100vh - 24px);max-height:820px}}
.adbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;max-width:420px;width:100%;justify-self:center}
.adbar{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute)}
.adbar a,.adbar button{color:var(--text);background:none;border:1px solid var(--line);border-radius:6px;padding:3px 9px;font:inherit;cursor:pointer;text-decoration:none;margin-left:4px}
.phone{border:6px solid #05080d;border-radius:30px;overflow:hidden;aspect-ratio:9/18;background:#fff}
.phone iframe{width:100%;height:100%;border:0;display:block}
.adbox.full{position:fixed;inset:0;z-index:1000;max-width:none;border-radius:0;background:var(--bg)}
.adbox.full .phone{flex:1;aspect-ratio:auto;border-width:2px;border-radius:12px}
body.noscroll{overflow:hidden}
#cv{touch-action:pan-y;cursor:grab}#cv.dragging{cursor:grabbing}
.hint{font-size:12px;margin-top:6px}
.player{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:9px;height:640px;min-width:0}
.player h3{font-family:'Chakra Petch';font-size:16px}
#vid{display:none;width:100%;max-height:170px;background:#000;border-radius:8px}
#viz{width:100%;height:84px;border-radius:8px;background:var(--bg);cursor:pointer;flex:none}
.trk{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player input[type=range]{width:100%;accent-color:#6fd3e6}
.tm{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-top:-4px}
.ctrls{display:flex;align-items:center;gap:6px}

const cache={};let qchain=Promise.resolve(),lastReq=0;
/* คิวเรียก CoinGecko: เว้นระยะ 2.5 วิ, ลองใหม่เมื่อโดนจำกัดอัตรา, ใช้แคชเดิมถ้าล้มเหลว */
function cg(path,ttl=0,onStale){
  const c=cache[path];
  if(c&&Date.now()-c.t<ttl)return Promise.resolve(c.v);
  if(onStale){let sv=c?c.v:null;if(!sv){try{sv=JSON.parse(localStorage["cg:"+path])}catch(e){}}if(sv)try{onStale(sv)}catch(e){}}
  const run=async()=>{
    let lastE;
    for(let a=0;a<4;a++){
      const w=Math.max(0,lastReq+2500-Date.now());if(w)await sleep(w);
      lastReq=Date.now();
      try{
        const r=await fetch("https://api.coingecko.com/api/v3"+path);
        if(r.ok){const v=await r.json();cache[path]={t:Date.now(),v};try{const js=JSON.stringify(v);if(js.length<400000)localStorage["cg:"+path]=js}catch(e){}return v}
        lastE=new Error("HTTP "+r.status);
      }catch(e){lastE=e}
      await sleep(4000*(a+1));
    }
    if(c)return c.v;
    throw lastE;
  };
  const p=qchain.then(run,run);qchain=p.catch(()=>{});return p;
}

const lum=h=>{const[r,g,b]=rgb(h);return(.299*r+.587*g+.114*b)/255};
function applyBg(){
  const R=document.documentElement.style,B=document.body.style,al=bgs.a/100;
  let p1=PBASE[theme][0],p2=PBASE[theme][1];
  if(bgs.c1){
    const l=bgs.g?(lum(bgs.c1)+lum(bgs.c2))/2:lum(bgs.c1),dk=l<.55,c=rgb(bgs.c1);
    p1=dk?c.map(v=>Math.round(v+(255-v)*.08)):[255,255,255];
    p2=dk?c.map(v=>Math.round(v+(255-v)*.16)):c.map(v=>Math.round(v*.94));
    R.setProperty("--bg",bgs.c1);
    R.setProperty("--text",dk?"#e8eef5":"#14202e");R.setProperty("--mute",dk?"#a7b8cb":"#41546a");R.setProperty("--line",dk?"#3a4f67":"#c3cfdc");
    B.background=bgs.g?`linear-gradient(135deg,${bgs.c1},${bgs.c2}) fixed`:bgs.c1;
  }else{["--bg","--text","--mute","--line"].forEach(k=>R.removeProperty(k));B.background=""}
  R.setProperty("--panel",`rgba(${p1},${al})`);R.setProperty("--panel2",`rgba(${p2},${Math.min(1,al+.1)})`);

}

function logo(c,s){

function fmtP(v,s){
  if(v==null)return"—";

  return (s??sym())+v.toLocaleString("en-US",{maximumFractionDigits:d});
}
function fmtBig(v){
  if(v==null)return"—";
  for(const [n,u] of t("big")) if(v>=n) return sym()+(v/n).toFixed(2)+(lang==="th"?" ":"")+u;
  return sym()+v.toLocaleString();
}

function fmtBig2(v){const s=cur;cur="usd";const r=fmtBig(v);cur=s;return r}

let view={a:0,b:1};
function draw(){
  const cv=$("cv"),dpr=devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;
  cv.width=W*dpr;cv.height=H*dpr;
  const g=cv.getContext("2d");g.scale(dpr,dpr);g.clearRect(0,0,W,H);
  const mute=css("--mute"),line=css("--line"),text=css("--text"),bg=css("--bg"),up=css("--up"),down=css("--down");
  const isC=ctype==="candle",all=isC?ohlc:series,N0=all.length;
  g.font="12px Sarabun";g.fillStyle=mute;
  if(N0<2){g.fillText(t("load"),20,30);return}
  const i0=Math.max(0,Math.floor(view.a*N0+1e-9)),i1=Math.min(N0,Math.max(i0+2,Math.ceil(view.b*N0-1e-9)));
  const V=all.slice(i0,i1),N=V.length;
  const col=COINS[sel].color,padL=8,padR=82,padT=12,padB=26,pw=W-padL-padR;
  let lo,hi;
  if(isC){lo=Math.min(...V.map(k=>k[3]));hi=Math.max(...V.map(k=>k[2]))}
  else{const ys=V.map(p=>p[1]);lo=Math.min(...ys);hi=Math.max(...ys)}
  const m=(hi-lo)*.08||hi*.01;lo-=m;hi+=m;
  const Y=v=>padT+(1-(v-lo)/(hi-lo))*(H-padT-padB);
  const times=V.map(k=>k[0]),x0=times[0],x1=times[N-1];
  const X=isC?(i=>padL+(i+.5)/N*pw):(i=>padL+(times[i]-x0)/(x1-x0)*pw);
  g.strokeStyle=line;g.lineWidth=1;
  for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4,y=Y(v);g.beginPath();g.moveTo(padL,y);g.lineTo(W-padR,y);g.stroke();g.fillStyle=mute;g.fillText(fmtP(v),W-padR+6,y+4)}
  const short=(x1-x0)<=2*864e5;
  const fmtT=ts=>{const d=new Date(ts);return short?d.toLocaleTimeString(t("loc"),{hour:"2-digit",minute:"2-digit"}):d.toLocaleDateString(t("loc"),{day:"numeric",month:"short"})};
  for(let i=0;i<=4;i++){const idx=Math.round((N-1)*i/4);g.textAlign=i===0?"left":i===4?"right":"center";g.fillStyle=mute;g.fillText(fmtT(times[idx]),X(idx),H-6)}
  g.textAlign="left";
  if(isC){
    const bw=Math.max(1,Math.min(30,pw/N*.7));
    V.forEach((k,i)=>{
      const x=X(i),c=k[4]>=k[1]?up:down;g.strokeStyle=c;g.fillStyle=c;g.lineWidth=1;
      g.beginPath();g.moveTo(x,Y(k[2]));g.lineTo(x,Y(k[3]));g.stroke();
      const yo=Y(k[1]),yc=Y(k[4]);g.fillRect(x-bw/2,Math.min(yo,yc),bw,Math.max(1,Math.abs(yo-yc)));
    });
  }else{
    const gr=g.createLinearGradient(0,padT,0,H-padB);gr.addColorStop(0,col+"55");gr.addColorStop(1,col+"00");
    g.beginPath();V.forEach((p,i)=>i?g.lineTo(X(i),Y(p[1])):g.moveTo(X(i),Y(p[1])));
    g.lineTo(X(N-1),H-padB);g.lineTo(X(0),H-padB);g.closePath();g.fillStyle=gr;g.fill();
    g.beginPath();V.forEach((p,i)=>i?g.lineTo(X(i),Y(p[1])):g.moveTo(X(i),Y(p[1])));
    g.strokeStyle=col;g.lineWidth=2;g.stroke();
  }
  if(i1>=N0){
    const lastP=isC?all[N0-1][4]:all[N0-1][1];
    g.fillStyle=col;g.fillRect(W-padR,Y(lastP)-10,padR-2,20);g.fillStyle="#0f1b2a";g.fillText(fmtP(lastP).slice(0,11),W-padR+4,Y(lastP)+4);
  }
  if(hover!=null){
    let b=0,bd=1e18;for(let i=0;i<N;i++){const d=Math.abs(X(i)-hover);if(d<bd){bd=d;b=i}}
    const x=X(b);
    g.strokeStyle=mute;g.setLineDash([4,4]);g.beginPath();g.moveTo(x,padT);g.lineTo(x,H-padB);g.stroke();g.setLineDash([]);
    let label;
    if(isC){const k=V[b];label=`${t("o")} ${fmtP(k[1])}  ${t("h")} ${fmtP(k[2])}  ${t("l")} ${fmtP(k[3])}  ${t("c")} ${fmtP(k[4])}`}
    else{const p=V[b];g.fillStyle=col;g.beginPath();g.arc(x,Y(p[1]),5,0,7);g.fill();label=fmtP(p[1])}
    label+="  "+new Date(times[b]).toLocaleString(t("loc"),{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
    const w=g.measureText(label).width+16,bx=Math.min(Math.max(x-w/2,padL),W-padR-w);
    g.fillStyle=bg;g.strokeStyle=col;g.fillRect(bx,padT+2,w,24);g.strokeRect(bx,padT+2,w,24);g.fillStyle=text;g.fillText(label,bx+8,padT+18);
  }
}
/* ซูม/เลื่อนกราฟ: ล้อเมาส์ซูม, ลากเลื่อน, ดับเบิลคลิกรีเซ็ต, นิ้วลาก/จีบ */
const cvEl=$("cv"),ptrs=new Map();let pan=null,pinch=null;
const PW=()=>cvEl.clientWidth-8-82;
function setView(a,w){
  const N=(ctype==="candle"?ohlc:series).length||2;
  w=Math.min(1,Math.max(Math.min(1,10/N),w));a=Math.min(Math.max(a,0),1-w);view={a,b:a+w};
}
cvEl.addEventListener("wheel",e=>{
  e.preventDefault();
  const w=view.b-view.a,cx=Math.min(1,Math.max(0,(e.offsetX-8)/PW())),nw=w*(e.deltaY<0?1/1.18:1.18),p=view.a+cx*w;
  setView(p-cx*nw,nw);draw();
},{passive:false});
cvEl.addEventListener("pointerdown",e=>{
  if(e.pointerType==="mouse"&&e.button!==0)return;
  cvEl.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,e.clientX);
  if(ptrs.size===1){pan={x:e.clientX,a:view.a,w:view.b-view.a};cvEl.classList.add("dragging")}
  else if(ptrs.size===2){const [x1,x2]=[...ptrs.values()];pinch={d:Math.abs(x1-x2)||1,a:view.a,w:view.b-view.a};pan=null}
});
cvEl.addEventListener("pointermove",e=>{
  if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,e.clientX);
  if(pinch&&ptrs.size===2){
    const [x1,x2]=[...ptrs.values()],nd=Math.abs(x1-x2)||1,nw=pinch.w*pinch.d/nd;
    const r=cvEl.getBoundingClientRect(),cx=Math.min(1,Math.max(0,((x1+x2)/2-r.left-8)/PW())),p=pinch.a+cx*pinch.w;
    setView(p-cx*nw,nw);hover=null;
  }else if(pan&&ptrs.size===1&&pan.w<.999){
    setView(pan.a-(e.clientX-pan.x)/PW()*pan.w,pan.w);hover=e.offsetX;
  }else hover=e.offsetX;
  draw();
});
const endP=e=>{
  ptrs.delete(e.pointerId);pinch=null;
  if(ptrs.size===1){pan={x:[...ptrs.values()][0],a:view.a,w:view.b-view.a}}
  else{pan=null;cvEl.classList.remove("dragging")}
  if(e.pointerType!=="mouse"){hover=null;draw()}
};
cvEl.addEventListener("pointerup",endP);cvEl.addEventListener("pointercancel",endP);
cvEl.addEventListener("pointerleave",e=>{if(e.pointerType==="mouse"&&!pan){hover=null;draw()}});
cvEl.addEventListener("dblclick",()=>{view={a:0,b:1};draw()});

function dbOp(stores,mode,fn){return idb.then(db=>{if(!db)throw new Error("idb");return new Promise((res,rej)=>{const x=db.transaction(stores,mode);let out;x.oncomplete=()=>res(out&&out.result);x.onerror=x.onabort=()=>rej(x.error);out=fn(x)})})}

async function addFiles(files){
  let list=[...files].filter(f=>/^(audio|video)\//.test(f.type)||/\.(mp3|mp4|m4a|wav|ogg|webm|aac|flac|mkv)$/i.test(f.name));
  const room=MAXPL-pl.length;if(list.length>room){note("pLimit");list=list.slice(0,room)}
  const wasEmpty=pl.length===0;
  for(const f of list){
    const m={name:f.name.replace(/\.[^.]+$/,""),type:f.type||(/\.(mp4|webm|mkv)$/i.test(f.name)?"video/mp4":"audio/mpeg"),size:f.size};
    let id=null;
    try{id=await dbOp(["meta","blob"],"readwrite",x=>{const r=x.objectStore("meta").add(m);r.onsuccess=()=>x.objectStore("blob").put(f,r.result);return r})}
    catch(e){if(!failedOnce){failedOnce=true;note("pFail")}}
    if(id==null)id=--tempId;

  }

function viz(){
  requestAnimationFrame(viz);
  const dpr=devicePixelRatio||1,W=vz.clientWidth,H=vz.clientHeight;
  if(vz.width!==Math.round(W*dpr)){vz.width=Math.round(W*dpr);vz.height=Math.round(H*dpr)}

  if(playing)an.getByteFrequencyData(fd);
  const n=bars.length;
  for(let i=0;i<n;i++){const v=playing?fd[Math.floor(i*fd.length*.7/n)]/255:0;bars[i]+=(v-bars[i])*(v>bars[i]?.6:.12)}
  const gr=g.createLinearGradient(0,H,0,0);gr.addColorStop(0,"#6fd3e6");gr.addColorStop(1,"#f7931a");
  g.fillStyle=gr;g.strokeStyle=gr;
  if(vmode===0){
    const bw=W/n;
    for(let i=0;i<n;i++){const h=Math.max(2,bars[i]*H*.95);g.fillRect(i*bw+1,H-h,bw-2,h)}
  }else if(vmode===1){
    g.lineWidth=2;g.beginPath();
    for(let i=0;i<n;i++){const x=i/(n-1)*W,y=H/2+(i%2?-1:1)*bars[i]*H*.45;i?g.lineTo(x,y):g.moveTo(x,y)}
    g.stroke();
  }else{
    const e=bars.slice(0,8).reduce((a,b)=>a+b,0)/8,r=Math.min(W,H)*(.18+e*.32);
    g.lineWidth=3;for(let k=0;k<3;k++){g.globalAlpha=1-k*.3;g.beginPath();g.arc(W/2,H/2,r+k*9*e+k*4,0,7);g.stroke()}g.globalAlpha=1;
  }
}
viz();

(async()=>{
  try{pl=(await dbOp("meta","readonly",x=>x.objectStore("meta").getAll())||[]).sort((a,b)=>a.id-b.id)}catch(e){pl=[]}
  renderPL();
})();
renderPL();
